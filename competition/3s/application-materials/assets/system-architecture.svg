<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">仓巡智调系统原理结构图</title>
  <desc id="desc">展示动态输入、操作界面、在线会话状态、智能调度决策、安全执行、状态反馈和可视化输出之间的闭环关系。</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f5d75"/>
      <stop offset="1" stop-color="#168f9f"/>
    </linearGradient>
    <linearGradient id="planner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f6f8"/>
      <stop offset="1" stop-color="#d6eef2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b68"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d66a35"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#173c48" flood-opacity="0.15"/>
    </filter>
    <style>
      .title { font: 700 36px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #ffffff; }
      .subtitle { font: 400 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #dff5f7; }
      .layer-title { font: 700 23px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #173c48; }
      .box-title { font: 700 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #173c48; }
      .body { font: 400 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #294b56; }
      .small { font: 400 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #476974; }
      .label { font: 700 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #315b68; }
      .card { fill: #ffffff; stroke: #8fb5bf; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .soft { fill: #f4f8f9; stroke: #b6cdd3; stroke-width: 1.4; rx: 12; }
      .arrow { fill: none; stroke: #315b68; stroke-width: 3; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #d66a35; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrowAccent); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f4f7f8"/>
  <rect width="1600" height="108" fill="url(#header)"/>
  <text x="58" y="56" class="title">仓巡智调：动态仓储多机器人在线调度与安全决策闭环</text>
  <text x="60" y="88" class="subtitle">免训练的启发式智能搜索 · 时空预约避碰 · 动态恢复 · 执行安全门 · 可解释证据</text>

  <text x="62" y="154" class="layer-title">输入与交互</text>
  <rect x="45" y="176" width="280" height="532" class="card"/>
  <rect x="69" y="205" width="232" height="104" class="soft"/>
  <text x="90" y="237" class="box-title">场景与设备配置</text>
  <text x="90" y="269" class="body">地图 / 货架 / 充电格</text>
  <text x="90" y="294" class="body">机器人能力、速度、电量</text>
  <rect x="69" y="329" width="232" height="130" class="soft"/>
  <text x="90" y="361" class="box-title">在线动态信息</text>
  <text x="90" y="393" class="body">任务到达、库存变化</text>
  <text x="90" y="418" class="body">通道封锁、故障与恢复</text>
  <text x="90" y="443" class="body">机器人接入与安全退役</text>
  <rect x="69" y="479" width="232" height="199" class="soft"/>
  <text x="90" y="512" class="box-title">React 操作控制台</text>
  <text x="90" y="544" class="body">地图选点与场景导入</text>
  <text x="90" y="569" class="body">任务、封锁、故障操作</text>
  <text x="90" y="594" class="body">播放 / 暂停 / 重置</text>
  <text x="90" y="619" class="body">事件、指标与历史回放</text>
  <text x="90" y="652" class="small">统一通过本机 API 进入后端</text>

  <text x="381" y="154" class="layer-title">在线状态与智能决策</text>
  <rect x="365" y="176" width="806" height="532" class="card"/>
  <rect x="392" y="205" width="752" height="112" rx="14" fill="#eef4f6" stroke="#8fb5bf" stroke-width="1.5"/>
  <text x="420" y="239" class="box-title">进程内在线会话状态（FastAPI）</text>
  <text x="420" y="271" class="body">机器人状态 · 待办/锁定/完成任务 · 权威库存 · 路径历史 · 事件日志 · 指标历史</text>
  <text x="420" y="297" class="small">同会话操作串行、候选副本校验成功后再发布；不同会话可在单进程内并行</text>

  <rect x="392" y="341" width="352" height="218" rx="14" fill="url(#planner)" stroke="#58a2ae" stroke-width="2"/>
  <text x="420" y="376" class="box-title">智能任务分配</text>
  <text x="420" y="408" class="body">Beam 启发式候选搜索</text>
  <text x="420" y="433" class="body">优先级 / 截止期 / 距离 / 电量</text>
  <text x="420" y="458" class="body">能力与载重硬约束</text>
  <text x="420" y="483" class="body">任务锁、软偏好与滚动窗口</text>
  <text x="420" y="523" class="small">输出：任务—机器人分配候选</text>

  <rect x="766" y="341" width="378" height="218" rx="14" fill="url(#planner)" stroke="#58a2ae" stroke-width="2"/>
  <text x="794" y="376" class="box-title">智能路径规划</text>
  <text x="794" y="408" class="body">A* 静态距离与单段路径</text>
  <text x="794" y="433" class="body">带时间维度的时空 A*</text>
  <text x="794" y="458" class="body">顶点预约与反向边预约</text>
  <text x="794" y="483" class="body">多种规划顺序与停车处理</text>
  <text x="794" y="523" class="small">输出：带绝对时间的候选路径</text>

  <rect x="392" y="583" width="752" height="95" rx="14" fill="#fff4e9" stroke="#dd9a61" stroke-width="2"/>
  <text x="420" y="617" class="box-title">执行安全与动态恢复</text>
  <text x="420" y="648" class="body">冲突复核 → 危险动作全队等待 → 重新规划；同时保留取货/巡检进度并给出结构化恢复建议</text>

  <text x="1227" y="154" class="layer-title">结果与反馈</text>
  <rect x="1211" y="176" width="344" height="532" class="card"/>
  <rect x="1238" y="205" width="290" height="127" class="soft"/>
  <text x="1265" y="239" class="box-title">调度结果</text>
  <text x="1265" y="271" class="body">任务分配与时间路径</text>
  <text x="1265" y="296" class="body">任务状态与失败原因</text>
  <rect x="1238" y="352" width="290" height="127" class="soft"/>
  <text x="1265" y="386" class="box-title">运行证据</text>
  <text x="1265" y="418" class="body">冲突、超期、距离、均衡</text>
  <text x="1265" y="443" class="body">事件日志与指标时间线</text>
  <rect x="1238" y="499" width="290" height="179" class="soft"/>
  <text x="1265" y="533" class="box-title">可视化与人工决策</text>
  <text x="1265" y="565" class="body">地图、路径和机器人状态</text>
  <text x="1265" y="590" class="body">任务队列与动态事件</text>
  <text x="1265" y="615" class="body">历史回放与异常解释</text>
  <text x="1265" y="650" class="small">操作员可暂停、恢复或重置</text>

  <path d="M325 420 H365" class="arrow"/>
  <text x="330" y="403" class="label">API</text>
  <path d="M744 450 H766" class="arrow"/>
  <path d="M768 317 V341" class="arrow"/>
  <path d="M568 559 V583" class="arrow"/>
  <path d="M955 559 V583" class="arrow"/>
  <path d="M1171 430 H1211" class="arrow"/>
  <text x="1179" y="412" class="label">输出</text>
  <path d="M1380 708 C1380 800 800 810 800 708" class="feedback"/>
  <text x="930" y="792" class="label" fill="#b75629">执行状态、库存、故障和新任务反馈到下一轮在线决策</text>

  <rect x="45" y="830" width="1510" height="42" rx="10" fill="#e9eef0"/>
  <text x="65" y="857" class="small">当前实现边界：软件仿真、本机回环服务、进程内会话；未部署实体传感器/机器人或边缘端算法，不宣称完整 CBS/MAPF 或任意输入零冲突。</text>
</svg>
